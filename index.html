
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thiệp cưới Hương Thu & Minh Nhật</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #f7f0e6;
      color: #634a3b;
      font-family: Georgia, serif;
      text-align: center;
    }
    .cover {
      position: relative;
      width: 100%;
      min-height: 100svh;
      display: grid;
      place-items: center;
      overflow: hidden;
    }
    .cover img {
      display: block;
      width: 100%;
      max-width: 560px;
      max-height: 100svh;
      object-fit: contain;
      cursor: pointer;
      transition: transform .8s ease, opacity .8s ease;
    }
    .cover.open img {
      transform: translateY(-35px) scale(1.04);
      opacity: 0;
    }
    .hint {
      position: absolute;
      bottom: 8%;
      padding: 10px 18px;
      background: #fff9;
      border-radius: 30px;
      font-size: 14px;
    }
    .invitation {
      display: none;
      min-height: 100svh;
      padding: 100px 24px;
      animation: appear 1s ease;
    }
    .invitation h1 {
      font-size: clamp(30px, 7vw, 48px);
      font-weight: normal;
    }
    @keyframes appear {
      from { opacity: 0; transform: translateY(25px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="cover" id="cover">
    <img
      id="envelope"
      src="TR%C3%82N%20TR%E1%BB%8CNG%20K%C3%8DNH%20M%E1%BB%9CI.jpg"
      alt="Phong bì thiệp cưới"
      onclick="openInvitation()"
    >
    <div class="hint">Chạm vào phong bì để mở ♡</div>
  </div>

  <section class="invitation" id="invitation">
    <p>TRÂN TRỌNG KÍNH MỜI</p>
    <h1>Hương Thu & Minh Nhật</h1>
    <p>09.01.2027</p>
    <p>Rất hân hạnh được đón tiếp bạn trong ngày vui của chúng mình!</p>
  </section>

  <script>
    function openInvitation() {
      document.getElementById("cover").classList.add("open");
      setTimeout(() => {
        document.getElementById("cover").style.display = "none";
        document.getElementById("invitation").style.display = "block";
      }, 800);
    }
  </script>
</body>
</html>
